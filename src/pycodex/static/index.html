<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PyCodex Trace</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#111a2e; --card:#17233c; --line:#283858; --text:#e8edf7; --muted:#9aabc8; --cyan:#57d9ff; --green:#7de2a8; --amber:#ffc267; --purple:#c29bff; --red:#ff8f9e; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:14px/1.55 Inter,ui-sans-serif,system-ui,sans-serif; }
    button { font:inherit; color:inherit; cursor:pointer; } .app { display:grid; grid-template-columns:300px minmax(0,1fr) 340px; min-height:100vh; }
    aside, main, .detail { min-width:0; } aside,.detail { background:var(--panel); padding:20px; } aside { border-right:1px solid var(--line); } .detail { border-left:1px solid var(--line); }
    h1,h2,h3,p { margin:0; } h1 { font-size:20px; letter-spacing:-.02em; } h2 { font-size:15px; } .subtle { color:var(--muted); font-size:12px; } .top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:18px; }
    .dot { width:9px; height:9px; border-radius:50%; background:var(--green); box-shadow:0 0 18px var(--green); } .icon-btn,.filter { border:1px solid var(--line); background:transparent; border-radius:8px; padding:7px 10px; }
    .icon-btn:hover,.filter:hover,.filter.active { border-color:var(--cyan); color:var(--cyan); } .sessions { display:grid; gap:8px; } .session { width:100%; text-align:left; padding:12px; background:transparent; border:1px solid transparent; border-radius:10px; }
    .session:hover,.session.active { background:var(--card); border-color:var(--line); } .session strong,.session span { display:block; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; } .session strong { font-size:12px; color:var(--cyan); } .session span { color:var(--muted); margin-top:4px; }
    main { padding:28px clamp(18px,4vw,56px); } .header { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:22px; } .filters { display:flex; flex-wrap:wrap; gap:7px; } .filter { color:var(--muted); }
    .timeline { position:relative; display:grid; gap:12px; } .timeline:before { content:""; position:absolute; top:0; bottom:0; left:13px; width:1px; background:var(--line); } .event { position:relative; margin-left:30px; padding:14px 16px; border:1px solid var(--line); border-radius:10px; background:var(--card); transition:transform .16s ease,border-color .16s ease; }
    .event:hover { transform:translateY(-1px); border-color:#4d6594; } .event:before { content:""; position:absolute; left:-23px; top:19px; width:10px; height:10px; border-radius:50%; background:var(--muted); border:3px solid var(--bg); } .event.user:before { background:var(--cyan); } .event.assistant:before { background:var(--purple); } .event.tool:before { background:var(--amber); } .event.status:before { background:var(--green); } .event.compaction:before { background:var(--red); }
    .event-head { display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:12px; margin-bottom:7px; } .event-body { white-space:pre-wrap; overflow-wrap:anywhere; } .empty { color:var(--muted); border:1px dashed var(--line); padding:30px; border-radius:12px; text-align:center; }
    .detail pre { margin:14px 0 0; padding:12px; overflow:auto; max-height:78vh; background:#09101f; border:1px solid var(--line); border-radius:9px; color:#c8d7f2; font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
    @media (max-width:980px) { .app { grid-template-columns:250px minmax(0,1fr); } .detail { display:none; } } @media (max-width:700px) { .app { display:block; } aside { border-right:0; border-bottom:1px solid var(--line); } .sessions { max-height:190px; overflow:auto; } main { padding:20px; } .header { display:block; } .filters { margin-top:14px; } }
  </style>
</head>
<body>
  <div class="app">
    <aside><div class="top"><div><h1>PyCodex Trace</h1><p class="subtle">会话与 Agent 事件回放</p></div><button class="icon-btn" id="refresh" aria-label="刷新会话">刷新</button></div><div class="sessions" id="sessions"></div></aside>
    <main><div class="header"><div><h2 id="title">选择一个会话</h2><p class="subtle" id="meta">显示模型、工具与压缩过程</p></div><div class="filters" id="filters"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="message">消息</button><button class="filter" data-filter="tool">工具</button><button class="filter" data-filter="status">状态</button><button class="filter" data-filter="compaction">压缩</button></div></div><section class="timeline" id="timeline"><div class="empty">正在加载会话…</div></section></main>
    <section class="detail"><h2>事件详情</h2><p class="subtle">点击时间线中的任意事件查看原始 JSON。</p><pre id="raw">{}</pre></section>
  </div>
  <script>
    const state={sessions:[],events:[],filter:'all',selected:null}; const $=id=>document.getElementById(id);
    const escape=value=>String(value??'').replace(/[&<>]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[char]));
    const formatTime=value=>value?new Date(value).toLocaleString():'—';
    function classify(event){ if(event.type==='agent_event') return event.event.includes('compaction')?'compaction':event.event.startsWith('tool_call')?'tool':'status'; if(event.type==='compaction') return 'compaction'; if(event.type!=='item') return 'status'; if(event.item.role==='tool'||event.item.tool_calls) return 'tool'; return event.item.role==='user'?'user':'assistant'; }
    function label(event,type){ if(event.type==='agent_event'&&event.event==='tool_call_started') return `tool started · ${event.data.name}`; if(event.type==='agent_event'&&event.event==='tool_call_completed') return `tool ${event.data.ok?'completed':'failed'} · ${event.data.name}`; if(event.type==='agent_event') return event.event.replaceAll('_',' '); if(event.type==='compaction') return 'context compacted'; if(event.item?.tool_calls) return 'tool calls'; if(event.item?.role==='tool') return 'tool result'; return event.item?.role||event.type; }
    function content(event){ if(event.type==='agent_event'&&event.event==='tool_call_started') return JSON.stringify(event.data.arguments,null,2); if(event.type==='agent_event'&&event.event==='tool_call_completed') return JSON.stringify(event.data.result,null,2); if(event.type==='agent_event') return JSON.stringify(event.data); if(event.type==='compaction') return '历史已压缩；完整原始事件仍保存在 JSONL。'; const item=event.item||{}; return item.content||JSON.stringify(item.tool_calls||item); }
    function visible(type){ return state.filter==='all'||(state.filter==='message'&&['user','assistant'].includes(type))||state.filter===type; }
    function renderTimeline(){ const target=$('timeline'); const events=state.events.filter(event=>visible(classify(event))); if(!events.length){target.innerHTML='<div class="empty">没有符合条件的事件。</div>';return;} target.innerHTML=events.map(event=>{const type=classify(event);return `<article class="event ${type}" tabindex="0" data-index="${event.index}"><div class="event-head"><strong>${escape(label(event,type))}</strong><span>${formatTime(event.at)}</span></div><div class="event-body">${escape(content(event))}</div></article>`}).join(''); target.querySelectorAll('.event').forEach(node=>node.onclick=()=>{$('raw').textContent=JSON.stringify(state.events.find(e=>e.index===Number(node.dataset.index)),null,2)}); }
    function renderSessions(){ $('sessions').innerHTML=state.sessions.length?state.sessions.map(s=>`<button class="session ${s.id===state.selected?'active':''}" data-id="${s.id}"><strong>${escape(s.id.slice(0,8))}</strong><span>${escape(s.preview||'空会话')}</span><span>${s.event_count} events · ${formatTime(s.updated_at*1000)}</span></button>`).join(''):'<div class="empty">还没有会话。先运行 pycodex。</div>'; document.querySelectorAll('.session').forEach(node=>node.onclick=()=>loadSession(node.dataset.id)); }
    async function loadSession(id){ const data=await fetch(`/api/sessions/${id}`).then(r=>r.json()); state.selected=id; state.events=data.events; $('title').textContent=`会话 ${id.slice(0,8)}`; $('meta').textContent=data.metadata.workspace||'未知工作区'; $('raw').textContent='{}'; renderSessions(); renderTimeline(); }
    async function loadSessions(){ state.sessions=await fetch('/api/sessions').then(r=>r.json()); renderSessions(); if(!state.selected&&state.sessions[0]) loadSession(state.sessions[0].id); }
    $('refresh').onclick=loadSessions; $('filters').onclick=event=>{const button=event.target.closest('button');if(!button)return;state.filter=button.dataset.filter;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b===button));renderTimeline();}; loadSessions();
  </script>
</body>
</html>
