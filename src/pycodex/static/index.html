<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PyCodex Console</title>
  <style>
    :root { --color-layer-tools:#3B82F6; --color-layer-planning:#10B981; --color-layer-memory:#8B5CF6; --color-layer-concurrency:#F59E0B; --color-layer-collaboration:#EF4444; --color-bg:#ffffff; --color-bg-secondary:#f4f4f5; --color-text:#09090b; --color-text-secondary:#71717a; --color-border:#e4e4e7; }
    .dark { --color-bg:#09090b; --color-bg-secondary:#18181b; --color-text:#fafafa; --color-text-secondary:#a1a1aa; --color-border:#27272a; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; } body { margin:0; min-height:100dvh; background:var(--color-bg); color:var(--color-text); font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; } button,textarea { font:inherit; } button { color:inherit; cursor:pointer; } button:focus-visible,textarea:focus-visible { outline:2px solid #3b82f6; outline-offset:2px; } a { color:inherit; text-decoration:none; }
    .header { position:sticky; top:0; z-index:50; border-bottom:1px solid var(--color-border); background:color-mix(in srgb,var(--color-bg) 80%,transparent); backdrop-filter:blur(4px); } .header-inner { height:56px; max-width:1280px; margin:auto; padding:0 16px; display:flex; align-items:center; justify-content:space-between; } .brand { font-size:18px; font-weight:700; letter-spacing:-.025em; } .desktop-nav { display:flex; align-items:center; gap:24px; } .nav-link { border:0; background:transparent; padding:4px 0; color:#71717a; font-size:14px; font-weight:500; } .dark .nav-link { color:#a1a1aa; } .nav-link:hover,.nav-link.active { color:#18181b; } .dark .nav-link:hover,.dark .nav-link.active { color:#fff; } .nav-actions { display:flex; align-items:center; gap:6px; margin-left:4px; } .icon-button { width:32px; height:32px; display:grid; place-items:center; border:0; border-radius:6px; background:transparent; color:#71717a; } .icon-button:hover { color:#3f3f46; background:var(--color-bg-secondary); } .dark .icon-button { color:#a1a1aa; } .dark .icon-button:hover { color:#fff; }
    .mobile-controls { display:none; align-items:center; gap:4px; } .mobile-menu { display:none; padding:12px 16px 16px; border-top:1px solid var(--color-border); background:var(--color-bg); } .mobile-menu.open { display:block; } .mobile-menu a { display:flex; min-height:44px; align-items:center; color:var(--color-text-secondary); }
    .page { max-width:1280px; min-height:calc(100dvh - 56px); margin:auto; padding:32px 16px; } .layout { display:flex; gap:32px; min-height:calc(100dvh - 120px); } .sidebar { width:224px; flex:0 0 224px; } .sidebar-inner { position:sticky; top:88px; display:grid; gap:20px; } .side-group-title { display:flex; align-items:center; justify-content:space-between; gap:6px; padding-bottom:6px; color:#a1a1aa; font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; } .dark .side-group-title { color:#71717a; } .side-group-title span { display:flex; align-items:center; gap:6px; } .side-dot { width:8px; height:8px; border-radius:50%; background:var(--color-layer-tools); } .new-chat { width:100%; min-height:38px; border:1px solid var(--color-border); border-radius:8px; background:var(--color-bg); color:var(--color-text); font-size:13px; font-weight:500; } .new-chat:hover { background:var(--color-bg-secondary); } .side-list { display:grid; gap:2px; margin:0; padding:0; list-style:none; } .session { width:100%; display:block; padding:7px 10px; border:0; border-radius:6px; background:transparent; color:#71717a; text-align:left; font-size:13px; transition:background .15s,color .15s; } .session:hover { color:#3f3f46; background:#fafafa; } .dark .session { color:#a1a1aa; } .dark .session:hover { color:#d4d4d8; background:rgba(39,39,42,.5); } .session.active { background:#f4f4f5; color:#18181b; font-weight:500; } .dark .session.active { background:#27272a; color:#fff; } .session-preview { display:block; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; } .session-id { display:block; overflow:hidden; margin-top:2px; color:#a1a1aa; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; white-space:nowrap; text-overflow:ellipsis; }
    .content { min-width:0; flex:1; display:flex; flex-direction:column; } .intro { margin-bottom:28px; } .intro h1 { margin:0; font-size:30px; line-height:1.2; letter-spacing:-.025em; } .intro p { max-width:672px; margin:10px 0 0; color:var(--color-text-secondary); font-size:16px; } .chat { flex:1; display:grid; align-content:start; gap:16px; max-width:896px; } .empty { display:grid; place-items:center; min-height:310px; padding:34px; border:1px dashed var(--color-border); border-radius:12px; color:var(--color-text-secondary); text-align:center; } .empty strong { display:block; margin-bottom:6px; color:var(--color-text); font-size:16px; } .message { display:flex; gap:12px; } .avatar { width:28px; height:28px; flex:none; display:grid; place-items:center; border-radius:8px; background:#18181b; color:white; font-size:11px; font-weight:700; } .dark .avatar { background:#fafafa; color:#18181b; } .message.user .avatar { background:#dbeafe; color:#1e40af; } .dark .message.user .avatar { background:#1e3a8a; color:#bfdbfe; } .message-main { min-width:0; flex:1; } .message-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:2px 0 6px; font-size:13px; font-weight:600; } .message-head time { color:var(--color-text-secondary); font-size:11px; font-weight:400; } .message-body { color:#3f3f46; white-space:pre-wrap; overflow-wrap:anywhere; font-size:14px; line-height:1.7; } .dark .message-body { color:#d4d4d8; } .event { margin-left:40px; padding:12px 14px; border:1px solid var(--color-border); border-radius:12px; background:var(--color-bg); box-shadow:0 1px 2px rgba(0,0,0,.03); } .event-top { display:flex; align-items:center; justify-content:space-between; gap:10px; } .badge { display:inline-flex; align-items:center; border-radius:999px; padding:2px 10px; background:#dbeafe; color:#1e40af; font-size:12px; font-weight:500; } .badge.git,.badge.status { background:#d1fae5; color:#065f46; } .badge.memory { background:#ede9fe; color:#5b21b6; } .dark .badge { background:rgba(30,58,138,.45); color:#93c5fd; } .dark .badge.git,.dark .badge.status { background:rgba(6,95,70,.4); color:#6ee7b7; } .dark .badge.memory { background:rgba(91,33,182,.4); color:#c4b5fd; } .event-name { font-size:13px; font-weight:600; } .event-body { max-height:180px; margin-top:9px; overflow:auto; padding:10px; border-radius:8px; background:var(--color-bg-secondary); color:var(--color-text-secondary); font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; overflow-wrap:anywhere; } .approval { margin-left:40px; padding:16px; border:1px solid #bfdbfe; border-radius:12px; background:#eff6ff; } .dark .approval { border-color:#1e3a8a; background:#172554; } .approval h2 { margin:0; font-size:14px; } .approval p { margin:6px 0 12px; color:#475569; font-size:13px; } .dark .approval p { color:#bfdbfe; } .approval-actions { display:flex; gap:8px; } .allow,.deny { min-height:34px; padding:0 12px; border-radius:7px; font-size:13px; font-weight:500; } .allow { border:0; background:#18181b; color:white; } .dark .allow { background:#fafafa; color:#18181b; } .deny { border:1px solid var(--color-border); background:transparent; color:var(--color-text-secondary); }
    .composer-wrap { position:sticky; bottom:0; margin-top:32px; padding-top:20px; background:linear-gradient(to bottom,transparent,var(--color-bg) 20%); } .composer { max-width:896px; border:1px solid var(--color-border); border-radius:12px; background:var(--color-bg); box-shadow:0 4px 18px rgba(0,0,0,.06); } .composer textarea { width:100%; min-height:84px; resize:vertical; padding:14px 14px 6px; border:0; background:transparent; color:var(--color-text); font:14px/1.5 inherit; } .composer textarea::placeholder { color:#a1a1aa; } .composer-footer { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 10px 10px 14px; } .composer-footer small { color:var(--color-text-secondary); font-size:11px; } .send { min-height:34px; padding:0 14px; border:0; border-radius:7px; background:#18181b; color:#fff; font-size:13px; font-weight:500; } .send:hover { background:#3f3f46; } .send:disabled { cursor:wait; opacity:.55; } .dark .send { background:#fafafa; color:#18181b; } .dark .send:hover { background:#e4e4e7; } .notice { display:none; max-width:896px; margin-bottom:16px; padding:12px 14px; border:1px solid #fecdd3; border-radius:8px; background:#fff1f2; color:#be123c; font-size:13px; } .notice.show { display:block; } .dark .notice { border-color:#881337; background:#4c0519; color:#fda4af; }
    @media (max-width:767px) { .desktop-nav { display:none; } .mobile-controls { display:flex; } .page { padding-top:24px; } .layout { display:block; } .sidebar { display:none; } .intro h1 { font-size:28px; } .event,.approval { margin-left:0; } } @media (min-width:768px) { .mobile-menu { display:none!important; } } @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition:none!important; } }
  </style>
</head>
<body>
  <header class="header"><div class="header-inner"><a class="brand" href="/">PyCodex Console</a><nav class="desktop-nav" aria-label="主导航"><a class="nav-link active" href="/">聊天</a><a class="nav-link" href="/trace">运行轨迹</a><div class="nav-actions"><button class="icon-button" id="theme" type="button" aria-label="切换深浅主题">◐</button></div></nav><div class="mobile-controls"><button class="icon-button" id="theme-mobile" type="button" aria-label="切换深浅主题">◐</button><button class="icon-button" id="menu" type="button" aria-label="打开菜单">☰</button></div></div><nav class="mobile-menu" id="mobile-menu"><a href="/">聊天</a><a href="/trace">运行轨迹</a></nav></header>
  <main class="page"><div class="layout"><aside class="sidebar"><div class="sidebar-inner"><button class="new-chat" id="new-chat" type="button">新建会话</button><section><div class="side-group-title"><span><i class="side-dot"></i>最近会话</span><span id="session-count">0</span></div><ul class="side-list" id="sessions"></ul></section><section><div class="side-group-title"><span><i class="side-dot" style="background:#8b5cf6"></i>工作区</span></div><div class="session" id="workspace-label">当前启动目录</div></section></div></aside>
    <section class="content"><div class="intro"><h1 id="title">和 PyCodex 一起工作</h1><p id="meta">描述你的任务；Agent 会读取项目、调用工具并持续汇报进度。</p></div><div class="notice" id="notice" role="status"></div><section class="chat" id="chat"><div class="empty"><div><strong>开始一个新任务</strong>例如：检查当前项目的测试失败原因，并做最小修复。</div></div></section><div class="composer-wrap"><form class="composer" id="composer"><textarea id="message" placeholder="给 PyCodex 一个任务…" aria-label="任务内容"></textarea><div class="composer-footer"><small>Enter 发送 · Shift + Enter 换行</small><button class="send" id="send" type="submit">发送</button></div></form></div></section>
  </div></main>
  <script>
    const state={sessions:[],events:[],selected:null,stream:null,sending:false}; const $=id=>document.getElementById(id); const escape=value=>String(value??'').replace(/[&<>]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[char])); const formatTime=value=>value?new Date(value).toLocaleString('zh-CN',{hour:'2-digit',minute:'2-digit'}):''; const eventName=event=>event.type==='agent_event'?event.event:'';
    function groupEvents(){const grouped=[];for(const event of state.events){const prior=grouped.at(-1);if(eventName(event)==='model_text_delta'&&prior?.kind==='assistant-stream'&&prior.step===event.data.step){prior.text+=event.data.text||'';continue;}if(eventName(event)==='model_text_delta'){grouped.push({...event,kind:'assistant-stream',step:event.data.step,text:event.data.text||''});continue;}grouped.push(event);}return grouped;} function isMessage(event){return event.type==='item'&&['user','assistant'].includes(event.item?.role)&&!event.item?.tool_calls;} function eventLabel(event){const name=eventName(event);if(name==='tool_call_started')return `调用工具 · ${event.data.name||'unknown'}`;if(name==='tool_call_completed')return `${event.data.ok?'工具完成':'工具失败'} · ${event.data.name||'unknown'}`;if(name==='tool_output')return `工具输出 · ${event.data.name||'unknown'}`;if(name==='git_context_captured')return `Git 状态 · ${event.data.phase||'已采集'}`;if(name==='model_request_started')return `模型请求 · 第 ${event.data.step||'—'} 轮`;if(name==='turn_completed')return '回答完成';if(name==='turn_failed')return '任务失败';if(event.type==='compaction'||name.includes('compaction'))return '上下文压缩';return name.replaceAll('_',' ')||event.type;} function eventClass(event){const name=eventName(event);if(event.type==='compaction'||name.includes('compaction'))return 'memory';if(name==='git_context_captured'||name.startsWith('git_'))return 'git';return name==='tool_call_started'||name==='tool_call_completed'||name==='tool_output'?'tool':'status';} function eventContent(event){const name=eventName(event);if(name==='tool_call_started')return JSON.stringify(event.data.arguments||{},null,2);if(name==='tool_call_completed')return JSON.stringify(event.data.result??event.data,null,2);if(name==='tool_output')return event.data.text||'';if(name==='git_context_captured')return JSON.stringify(event.data.result||event.data,null,2);if(name==='turn_failed')return event.data.error||'';if(event.type==='compaction')return '已保存压缩后的上下文；完整的运行记录仍保留在本地会话文件中。';return '';}
    function renderChat(){const items=groupEvents().filter(event=>event.type!=='session'&&!(event.type==='item'&&event.item?.role==='system')&&eventName(event)!=='model_request_completed');const target=$('chat');if(!items.length){target.innerHTML='<div class="empty"><div><strong>开始一个新任务</strong>例如：检查当前项目的测试失败原因，并做最小修复。</div></div>';return;}target.innerHTML=items.map(event=>{if(isMessage(event)||event.kind==='assistant-stream'){const role=event.kind==='assistant-stream'?'assistant':event.item.role;const text=event.kind==='assistant-stream'?event.text:event.item.content||'';if(!text)return '';return `<article class="message ${role}"><div class="avatar">${role==='user'?'你':'PC'}</div><div class="message-main"><div class="message-head"><span>${role==='user'?'你':'PyCodex'}</span><time>${escape(formatTime(event.at))}</time></div><div class="message-body">${escape(text)}</div></div></article>`;}if(eventName(event)==='approval_requested'){return `<article class="approval"><h2>需要你的确认</h2><p>允许 Agent 执行 <strong>${escape(event.data.name)}</strong> 吗？</p><div class="approval-actions"><button class="allow" type="button" data-approval="${event.data.approval_id}" data-allowed="true">允许</button><button class="deny" type="button" data-approval="${event.data.approval_id}" data-allowed="false">拒绝</button></div></article>`;}const type=eventClass(event);const content=eventContent(event);return `<article class="event"><div class="event-top"><span class="badge ${type}">${type==='tool'?'工具':type==='git'?'Git':type==='memory'?'记忆':'运行'}</span><span class="event-name">${escape(eventLabel(event))}</span></div>${content?`<div class="event-body">${escape(content)}</div>`:''}</article>`;}).join('');target.querySelectorAll('[data-approval]').forEach(button=>button.addEventListener('click',()=>resolveApproval(button.dataset.approval,button.dataset.allowed==='true')));}
    function renderSessions(){const target=$('sessions');$('session-count').textContent=state.sessions.length;target.innerHTML=state.sessions.length?state.sessions.map(session=>`<li><button class="session ${session.id===state.selected?'active':''}" type="button" data-id="${session.id}"><span class="session-preview">${escape(session.preview||'空会话')}</span><span class="session-id">${escape(session.id.slice(0,8))}</span></button></li>`).join(''):'<li class="session">暂无会话</li>';target.querySelectorAll('[data-id]').forEach(button=>button.addEventListener('click',()=>loadSession(button.dataset.id)));} function connect(id){state.stream?.close();const after=state.events.at(-1)?.index??-1;state.stream=new EventSource(`/api/sessions/${id}/events?after=${after}`);state.stream.onmessage=message=>{const event=JSON.parse(message.data);if(event.index<=(state.events.at(-1)?.index??-1))return;state.events.push(event);renderChat();};} async function loadSession(id){try{const response=await fetch(`/api/sessions/${id}`);if(!response.ok)throw new Error('无法读取会话');const data=await response.json();state.selected=id;state.events=data.events;$('title').textContent=`会话 ${id.slice(0,8)}`;$('meta').textContent=data.metadata.workspace||'未知工作区';$('workspace-label').textContent=data.metadata.workspace||'当前启动目录';renderSessions();renderChat();connect(id);}catch(error){showNotice(error.message);}} async function loadSessions(){try{const response=await fetch('/api/sessions');if(!response.ok)throw new Error('无法读取会话列表');state.sessions=await response.json();renderSessions();}catch(error){showNotice(error.message);}} function showNotice(message){$('notice').textContent=message;$('notice').classList.add('show');}
    async function send(message){if(state.sending||!message.trim())return;state.sending=true;$('send').disabled=true;try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,session_id:state.selected})});const data=await response.json();if(!response.ok)throw new Error(data.detail||'无法启动任务');state.selected=data.session_id;state.events=[];$('title').textContent=`会话 ${data.session_id.slice(0,8)}`;$('meta').textContent='正在连接 Agent…';renderChat();connect(data.session_id);await loadSessions();}catch(error){showNotice(error.message);}finally{state.sending=false;$('send').disabled=false;}} async function resolveApproval(approvalId,allowed){try{const response=await fetch(`/api/sessions/${state.selected}/approvals/${approvalId}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({allowed})});if(!response.ok)throw new Error('无法提交确认');}catch(error){showNotice(error.message);}}
    function toggleTheme(){document.documentElement.classList.toggle('dark');localStorage.setItem('theme',document.documentElement.classList.contains('dark')?'dark':'light');} if(localStorage.getItem('theme')==='dark'||(!localStorage.getItem('theme')&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');$('composer').addEventListener('submit',event=>{event.preventDefault();const message=$('message').value;$('message').value='';send(message);});$('message').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();$('composer').requestSubmit();}});$('new-chat').addEventListener('click',()=>{state.stream?.close();state.selected=null;state.events=[];$('title').textContent='和 PyCodex 一起工作';$('meta').textContent='描述你的任务；Agent 会读取项目、调用工具并持续汇报进度。';renderSessions();renderChat();$('message').focus();});$('theme').addEventListener('click',toggleTheme);$('theme-mobile').addEventListener('click',toggleTheme);$('menu').addEventListener('click',()=>$('mobile-menu').classList.toggle('open'));window.addEventListener('beforeunload',()=>state.stream?.close());loadSessions();setInterval(loadSessions,5000);
  </script>
</body>
</html>
