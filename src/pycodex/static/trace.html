<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PyCodex Console</title>
  <style>
    :root { --color-layer-tools:#3B82F6; --color-layer-planning:#10B981; --color-layer-memory:#8B5CF6; --color-layer-concurrency:#F59E0B; --color-layer-collaboration:#EF4444; --color-bg:#fff; --color-bg-secondary:#f4f4f5; --color-text:#09090b; --color-text-secondary:#71717a; --color-border:#e4e4e7; }
    .dark { --color-bg:#09090b; --color-bg-secondary:#18181b; --color-text:#fafafa; --color-text-secondary:#a1a1aa; --color-border:#27272a; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; } body { margin:0; background:var(--color-bg); color:var(--color-text); font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; } button { font:inherit; color:inherit; cursor:pointer; } button:focus-visible { outline:2px solid #3b82f6; outline-offset:2px; } a { color:inherit; text-decoration:none; }
    .header { position:sticky; top:0; z-index:50; border-bottom:1px solid var(--color-border); background:color-mix(in srgb,var(--color-bg) 80%,transparent); backdrop-filter:blur(4px); } .header-inner { height:56px; max-width:1280px; margin:auto; padding:0 16px; display:flex; align-items:center; justify-content:space-between; } .brand { font-size:18px; font-weight:700; letter-spacing:-.025em; } .desktop-nav { display:flex; align-items:center; gap:24px; } .nav-link { border:0; background:transparent; padding:4px 0; color:#71717a; font-size:14px; font-weight:500; transition:color .15s; } .dark .nav-link { color:#a1a1aa; } .nav-link:hover,.nav-link.active { color:#18181b; } .dark .nav-link:hover,.dark .nav-link.active { color:#fff; } .nav-actions { display:flex; align-items:center; gap:6px; margin-left:4px; } .icon-button { width:32px; height:32px; display:grid; place-items:center; border:0; border-radius:6px; background:transparent; color:#71717a; } .icon-button:hover { color:#3f3f46; background:var(--color-bg-secondary); } .dark .icon-button { color:#a1a1aa; } .dark .icon-button:hover { color:#fff; }
    .mobile-controls { display:none; align-items:center; gap:4px; } .mobile-menu { display:none; padding:12px 16px 16px; border-top:1px solid var(--color-border); background:var(--color-bg); } .mobile-menu.open { display:block; } .mobile-menu .nav-link { display:flex; width:100%; min-height:44px; align-items:center; }
    .page { max-width:1280px; margin:0 auto; padding:32px 16px 64px; } .layout { display:flex; gap:32px; } .sidebar { width:224px; flex:0 0 224px; } .sidebar-inner { position:sticky; top:88px; display:grid; gap:20px; } .side-group-title { display:flex; align-items:center; gap:6px; padding-bottom:6px; color:#a1a1aa; font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; } .dark .side-group-title { color:#71717a; } .side-dot { width:8px; height:8px; border-radius:50%; } .side-list { display:grid; gap:2px; margin:0; padding:0; list-style:none; } .side-item { width:100%; display:block; padding:6px 10px; border:0; border-radius:6px; background:transparent; color:#71717a; text-align:left; font-size:14px; transition:background .15s,color .15s; } .side-item:hover { color:#3f3f46; background:#fafafa; } .dark .side-item { color:#a1a1aa; } .dark .side-item:hover { color:#d4d4d8; background:rgba(39,39,42,.5); } .side-item.active { background:#f4f4f5; color:#18181b; font-weight:500; } .dark .side-item.active { background:#27272a; color:#fff; } .side-session { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; } .side-session small { margin-left:6px; color:#a1a1aa; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; }
    .content { min-width:0; flex:1; } .intro { margin-bottom:32px; } .intro h1 { margin:0; font-size:30px; line-height:1.2; letter-spacing:-.025em; } .intro p { max-width:672px; margin:10px 0 0; color:var(--color-text-secondary); font-size:16px; } .toolbar { display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px; margin-top:20px; padding-top:16px; border-top:1px solid var(--color-border); } .tabs { display:flex; overflow:auto; border-bottom:1px solid var(--color-border); } .tab { flex:none; padding:8px 16px; border:0; border-bottom:2px solid transparent; background:transparent; color:#71717a; font-size:14px; font-weight:500; } .tab:hover { color:#3f3f46; } .tab.active { border-bottom-color:#18181b; color:#18181b; } .dark .tab { color:#a1a1aa; } .dark .tab:hover { color:#e4e4e7; } .dark .tab.active { border-bottom-color:#fff; color:#fff; } .refresh { min-height:36px; padding:0 12px; border:1px solid var(--color-border); border-radius:8px; background:var(--color-bg); color:var(--color-text-secondary); font-size:13px; font-weight:500; } .refresh:hover { background:var(--color-bg-secondary); color:var(--color-text); }
    .summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin:24px 0 32px; } .card { border:1px solid var(--color-border); border-radius:12px; background:var(--color-bg); padding:18px; box-shadow:0 1px 2px rgba(0,0,0,.03); } .card-value { display:block; font-size:22px; font-weight:650; letter-spacing:-.025em; } .card-label { display:block; margin-top:4px; color:var(--color-text-secondary); font-size:12px; }
    .timeline-head { display:flex; align-items:end; justify-content:space-between; gap:16px; margin-bottom:16px; } .timeline-head h2 { margin:0; font-size:18px; letter-spacing:-.015em; } .timeline-head p { margin:4px 0 0; color:var(--color-text-secondary); font-size:13px; } .timeline-count { color:var(--color-text-secondary); font-size:12px; white-space:nowrap; } .timeline { position:relative; display:grid; gap:0; } .timeline-event { position:relative; display:flex; gap:16px; padding-bottom:24px; } .timeline-event:last-child { padding-bottom:0; } .rail { display:flex; width:24px; flex:0 0 24px; flex-direction:column; align-items:center; } .rail-dot { z-index:1; width:16px; height:16px; display:grid; place-items:center; border:4px solid var(--color-bg); border-radius:50%; } .rail-line { width:2px; flex:1; margin-top:2px; background:#d4d4d8; } .dark .rail-line { background:#3f3f46; } .timeline-event:last-child .rail-line { display:none; } .event-card { width:100%; padding:16px 18px; border:1px solid var(--color-border); border-radius:12px; background:var(--color-bg); box-shadow:0 1px 2px rgba(0,0,0,.03); text-align:left; } .event-card:hover { border-color:#a1a1aa; } .dark .event-card:hover { border-color:#52525b; } .event-head { display:flex; align-items:center; justify-content:space-between; gap:12px; } .event-title { display:flex; min-width:0; align-items:center; gap:8px; font-size:14px; font-weight:600; } .event-title span:last-child { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; } .event-time { color:var(--color-text-secondary); font-size:12px; white-space:nowrap; } .badge { display:inline-flex; flex:none; align-items:center; border-radius:999px; padding:2px 10px; font-size:12px; font-weight:500; } .badge.user { background:#dbeafe; color:#1e40af; } .badge.assistant { background:#ede9fe; color:#5b21b6; } .badge.tool { background:#dbeafe; color:#1e40af; } .badge.git,.badge.status { background:#d1fae5; color:#065f46; } .badge.memory { background:#ede9fe; color:#5b21b6; } .dark .badge.user,.dark .badge.tool { background:rgba(30,58,138,.45); color:#93c5fd; } .dark .badge.assistant,.dark .badge.memory { background:rgba(91,33,182,.4); color:#c4b5fd; } .dark .badge.git,.dark .badge.status { background:rgba(6,95,70,.4); color:#6ee7b7; } .event-body { margin-top:10px; color:#3f3f46; white-space:pre-wrap; overflow-wrap:anywhere; font-size:13px; line-height:1.6; } .dark .event-body { color:#d4d4d8; } .timeline-event.tool .event-body,.timeline-event.git .event-body { max-height:180px; overflow:auto; border-radius:8px; background:#f4f4f5; padding:12px; color:#52525b; font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; } .dark .timeline-event.tool .event-body,.dark .timeline-event.git .event-body { background:#18181b; color:#a1a1aa; }
    .empty { padding:34px; border:1px dashed var(--color-border); border-radius:12px; color:var(--color-text-secondary); text-align:center; } .notice { display:none; margin-bottom:16px; padding:12px 14px; border:1px solid #fecdd3; border-radius:8px; background:#fff1f2; color:#be123c; font-size:13px; } .notice.show { display:block; } .dark .notice { border-color:#881337; background:#4c0519; color:#fda4af; }
    dialog { width:min(760px,calc(100% - 32px)); max-height:80vh; padding:0; border:1px solid var(--color-border); border-radius:12px; background:var(--color-bg); color:var(--color-text); box-shadow:0 20px 60px rgba(0,0,0,.35); } dialog::backdrop { background:rgba(9,9,11,.55); } .dialog-head { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--color-border); } .dialog-head h2 { margin:0; font-size:14px; } .dialog-close { border:0; background:transparent; color:var(--color-text-secondary); font-size:13px; } .raw { max-height:calc(80vh - 56px); margin:0; overflow:auto; padding:18px; color:var(--color-text-secondary); font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; }
    @media (max-width:767px) { .desktop-nav { display:none; } .mobile-controls { display:flex; } .page { padding-top:24px; } .layout { display:block; } .sidebar { display:none; } .intro h1 { font-size:28px; } .summary { grid-template-columns:repeat(2,minmax(0,1fr)); } } @media (min-width:768px) { .mobile-menu { display:none!important; } } @media (max-width:430px) { .summary { gap:8px; } .card { padding:14px; } .tab { padding:8px 12px; } .event-head { align-items:flex-start; flex-direction:column; gap:4px; } }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition:none!important; } }
  </style>
</head>
<body>
  <header class="header"><div class="header-inner"><a class="brand" href="#top">PyCodex Console</a><nav class="desktop-nav" aria-label="主导航"><button class="nav-link active" type="button">会话轨迹</button><button class="nav-link" type="button">工具调用</button><button class="nav-link" type="button">运行记录</button><div class="nav-actions"><button class="icon-button" id="theme" type="button" aria-label="切换深浅主题">◐</button></div></nav><div class="mobile-controls"><button class="icon-button" id="theme-mobile" type="button" aria-label="切换深浅主题">◐</button><button class="icon-button" id="menu" type="button" aria-label="打开菜单">☰</button></div></div><nav class="mobile-menu" id="mobile-menu" aria-label="移动导航"><button class="nav-link active" type="button">会话轨迹</button><button class="nav-link" type="button">工具调用</button><button class="nav-link" type="button">运行记录</button></nav></header>
  <main class="page" id="top"><div class="layout"><aside class="sidebar"><div class="sidebar-inner"><section><div class="side-group-title"><i class="side-dot" style="background:#3b82f6"></i>最近会话</div><ul class="side-list" id="sessions"></ul></section><section><div class="side-group-title"><i class="side-dot" style="background:#10b981"></i>执行与工具</div><ul class="side-list"><li><button class="side-item" type="button" data-filter="tool">工具调用</button></li><li><button class="side-item" type="button" data-filter="git">Git 状态</button></li><li><button class="side-item" type="button" data-filter="status">运行状态</button></li></ul></section><section><div class="side-group-title"><i class="side-dot" style="background:#8b5cf6"></i>会话记忆</div><ul class="side-list"><li><button class="side-item" type="button" data-filter="memory">上下文压缩</button></li><li><button class="side-item" type="button" data-filter="conversation">用户与模型消息</button></li></ul></section></div></aside>
    <section class="content"><div class="notice" id="notice" role="status"></div><div class="intro"><h1 id="title">PyCodex Agent 轨迹</h1><p id="meta">查看每一次模型请求、流式回复、工具调用与上下文管理过程。</p><div class="toolbar"><div class="tabs" id="filters" aria-label="事件筛选"><button class="tab active" type="button" data-filter="all">全部</button><button class="tab" type="button" data-filter="conversation">对话</button><button class="tab" type="button" data-filter="tool">工具</button><button class="tab" type="button" data-filter="git">Git</button><button class="tab" type="button" data-filter="memory">记忆</button></div><button class="refresh" id="refresh" type="button">刷新会话</button></div></div>
      <section class="summary" aria-label="会话统计"><div class="card"><strong class="card-value" id="stat-events">—</strong><span class="card-label">轨迹事件</span></div><div class="card"><strong class="card-value" id="stat-turns">—</strong><span class="card-label">模型轮次</span></div><div class="card"><strong class="card-value" id="stat-tools">—</strong><span class="card-label">工具调用</span></div><div class="card"><strong class="card-value" id="stat-memory">—</strong><span class="card-label">上下文压缩</span></div></section>
      <section><div class="timeline-head"><div><h2>运行时间线</h2><p>点击任意事件查看完整 JSON 记录。</p></div><span class="timeline-count" id="timeline-count"></span></div><div class="timeline" id="timeline"><div class="empty">正在加载会话…</div></div></section>
    </section></div></main>
  <dialog id="detail"><div class="dialog-head"><h2 id="detail-title">事件详情</h2><button class="dialog-close" id="close-detail" type="button">关闭</button></div><pre class="raw" id="raw">{}</pre></dialog>
  <script>
    const state={sessions:[],events:[],filter:'all',selected:null,stream:null}; const $=id=>document.getElementById(id); const escape=value=>String(value??'').replace(/[&<>]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[char])); const formatTime=value=>value?new Date(value).toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—'; const eventName=event=>event.type==='agent_event'?event.event:'';
    function classify(event){const name=eventName(event);if(event.type==='compaction'||name.includes('compaction'))return 'memory';if(name==='git_context_captured'||name.startsWith('git_'))return 'git';if(name.startsWith('tool_')||event.item?.role==='tool'||event.item?.tool_calls)return 'tool';if(name==='model_text_delta'||event.item?.role==='assistant')return 'assistant';if(event.item?.role==='user')return 'user';return 'status';} function matches(event){const type=classify(event);return state.filter==='all'||(state.filter==='conversation'&&['user','assistant'].includes(type))||state.filter===type;} function label(event,type){const name=eventName(event);if(event.grouped)return `流式回复 · 第 ${event.step||'—'} 轮`;if(name==='tool_call_started')return `调用工具 · ${event.data.name||'unknown'}`;if(name==='tool_call_completed')return `${event.data.ok?'工具完成':'工具失败'} · ${event.data.name||'unknown'}`;if(name==='tool_output')return `工具输出 · ${event.data.name||'unknown'}`;if(name==='git_context_captured')return `Git 状态 · ${event.data.phase||'已采集'}`;if(name==='model_request_started')return `模型请求 · 第 ${event.data.step||'—'} 轮`;if(name==='model_request_completed')return `模型响应完成 · 第 ${event.data.step||'—'} 轮`;if(type==='memory')return '上下文已压缩';if(event.item?.tool_calls)return `计划调用 ${event.item.tool_calls.length} 个工具`;if(event.item?.role==='tool')return '工具结果';if(event.item?.role==='user')return '用户任务';if(event.item?.role==='assistant')return '助手消息';return name.replaceAll('_',' ')||event.type;} function content(event,type){const name=eventName(event);if(event.grouped)return event.text;if(name==='tool_output')return event.data.text||'';if(name==='tool_call_started')return JSON.stringify(event.data.arguments||{},null,2);if(name==='tool_call_completed')return JSON.stringify(event.data.result??event.data,null,2);if(name==='git_context_captured')return JSON.stringify(event.data.result||event.data,null,2);if(type==='memory')return '模型上下文已替换为压缩摘要，完整历史事件仍保留在本地 JSONL。';const item=event.item||{};return item.content||JSON.stringify(item.tool_calls||event.data||item,null,2);} function displayEvents(){const result=[];for(const event of state.events){const previous=result.at(-1);if(eventName(event)==='model_text_delta'&&previous?.grouped&&previous.step===event.data.step){previous.text+=event.data.text||'';continue;}if(eventName(event)==='model_text_delta'){result.push({...event,grouped:true,step:event.data.step,text:event.data.text||''});continue;}result.push(event);}return result;}
    function stats(){const count=predicate=>state.events.filter(predicate).length;$('stat-events').textContent=state.events.length;$('stat-turns').textContent=count(e=>eventName(e)==='model_request_started');$('stat-tools').textContent=count(e=>eventName(e)==='tool_call_started');$('stat-memory').textContent=count(e=>e.type==='compaction'||eventName(e)==='compaction_completed');} function badge(type){return type==='assistant'?'模型':type==='user'?'任务':type==='tool'?'工具':type==='git'?'Git':type==='memory'?'记忆':'运行';} function renderTimeline(){const events=displayEvents().filter(matches);$('timeline-count').textContent=state.events.length?`${events.length} / ${state.events.length} 条事件`:'';const target=$('timeline');if(!events.length){target.innerHTML='<div class="empty">没有符合当前筛选条件的事件。</div>';return;}target.innerHTML=events.map(event=>{const type=classify(event);const color={user:'#3b82f6',assistant:'#8b5cf6',tool:'#3b82f6',git:'#10b981',memory:'#8b5cf6',status:'#10b981'}[type];return `<article class="timeline-event ${type}"><div class="rail"><span class="rail-dot" style="background:${color}"></span><span class="rail-line"></span></div><button class="event-card" type="button" data-index="${event.index}"><div class="event-head"><div class="event-title"><span class="badge ${type}">${badge(type)}</span><span>${escape(label(event,type))}</span></div><time class="event-time">${escape(formatTime(event.at))}</time></div><div class="event-body">${escape(content(event,type))}</div></button></article>`}).join('');target.querySelectorAll('[data-index]').forEach(node=>node.addEventListener('click',()=>showDetail(Number(node.dataset.index))));} function renderSessions(){const target=$('sessions');target.innerHTML=state.sessions.length?state.sessions.map(session=>`<li><button class="side-item side-session ${session.id===state.selected?'active':''}" type="button" data-id="${session.id}">${escape(session.preview||'空会话')}<small>${escape(session.id.slice(0,8))}</small></button></li>`).join(''):'<li class="side-item">暂无会话</li>';target.querySelectorAll('[data-id]').forEach(node=>node.addEventListener('click',()=>loadSession(node.dataset.id)));} function showDetail(index){const event=state.events.find(item=>item.index===index);if(!event)return;$('detail-title').textContent=`事件 #${index}`;$('raw').textContent=JSON.stringify(event,null,2);$('detail').showModal();}
    function connect(id){state.stream?.close();const after=state.events.at(-1)?.index??-1;state.stream=new EventSource(`/api/sessions/${id}/events?after=${after}`);state.stream.onmessage=message=>{const event=JSON.parse(message.data);if(event.index<=(state.events.at(-1)?.index??-1))return;state.events.push(event);stats();renderTimeline();};} async function loadSession(id){try{const response=await fetch(`/api/sessions/${id}`);if(!response.ok)throw new Error('无法读取会话');const data=await response.json();state.selected=id;state.events=data.events;$('title').textContent=`会话 ${id.slice(0,8)}`;$('meta').textContent=data.metadata.workspace||'未知工作区';stats();renderSessions();renderTimeline();connect(id);}catch(error){$('notice').textContent=error.message;$('notice').classList.add('show');}} async function loadSessions(){try{const response=await fetch('/api/sessions');if(!response.ok)throw new Error('无法读取会话列表');state.sessions=await response.json();renderSessions();if(!state.selected&&state.sessions[0])await loadSession(state.sessions[0].id);}catch(error){$('notice').textContent=error.message;$('notice').classList.add('show');}}
    function setFilter(value){state.filter=value;document.querySelectorAll('[data-filter]').forEach(item=>item.classList.toggle('active',item.dataset.filter===value));renderTimeline();} function toggleTheme(){document.documentElement.classList.toggle('dark');localStorage.setItem('theme',document.documentElement.classList.contains('dark')?'dark':'light');} if(localStorage.getItem('theme')==='dark'||(!localStorage.getItem('theme')&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');$('filters').addEventListener('click',event=>{const button=event.target.closest('[data-filter]');if(button)setFilter(button.dataset.filter);});document.querySelectorAll('.sidebar [data-filter]').forEach(button=>button.addEventListener('click',()=>setFilter(button.dataset.filter)));$('refresh').addEventListener('click',loadSessions);$('theme').addEventListener('click',toggleTheme);$('theme-mobile').addEventListener('click',toggleTheme);$('menu').addEventListener('click',()=>$('mobile-menu').classList.toggle('open'));$('close-detail').addEventListener('click',()=>$('detail').close());window.addEventListener('beforeunload',()=>state.stream?.close());loadSessions();setInterval(loadSessions,5000);
  </script>
</body>
</html>
